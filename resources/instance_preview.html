<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="{{CSP}}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实例预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    body {
      margin: 0;
      padding: 20px 24px;
      font-family: var(--vscode-font-family);
      font-size: 13px;
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
    }
    .section {
      margin-bottom: 24px;
      padding: 16px;
      background: var(--vscode-editor-inactiveSelectionBackground);
      border-radius: 8px;
      border: 1px solid var(--vscode-widget-border);
    }
    .section-title {
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 12px;
      color: var(--vscode-foreground);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.9;
    }
    .preview-row {
      margin-bottom: 10px;
      font-size: 12px;
    }
    .preview-label {
      color: var(--vscode-descriptionForeground);
      margin-bottom: 4px;
      font-size: 11px;
    }
    .preview-value {
      padding: 8px 12px;
      background: var(--vscode-editor-background);
      border: 1px solid var(--vscode-input-border);
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 12px;
      line-height: 1.45;
      max-height: 200px;
      overflow-y: auto;
    }
    .preview-value.inline {
      max-height: none;
      font-weight: 500;
    }
    .response-status {
      padding: 8px 0;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .response-status.success { color: var(--vscode-testing-iconPassed); }
    .response-status.error { color: var(--vscode-errorForeground); }
    .scrollbar-hidden {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .scrollbar-hidden::-webkit-scrollbar { display: none; }
    .res-body-image, .res-body-binary { display: none; margin-top: 8px; }
    .res-body-image.show, .res-body-binary.show { display: block; }
    .res-body-image img {
      max-width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 6px;
      border: 1px solid var(--vscode-input-border);
    }
    .res-body-binary .res-binary-desc { font-size: 12px; color: var(--vscode-descriptionForeground); margin-bottom: 8px; }
    .btn-download-preview {
      padding: 6px 14px; font-size: 12px; cursor: pointer;
      background: var(--vscode-button-background); color: var(--vscode-button-foreground);
      border: none; border-radius: 6px;
    }
    .btn-download-preview:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="section">
    <div class="section-title">请求</div>
    <div class="preview-row">
      <div class="preview-label">方法</div>
      <div class="preview-value inline" id="reqMethod">-</div>
    </div>
    <div class="preview-row">
      <div class="preview-label">URL</div>
      <div class="preview-value inline" id="reqUrl">-</div>
    </div>
    <div class="preview-row" id="reqHeadersWrap">
      <div class="preview-label">请求头</div>
      <pre class="preview-value scrollbar-hidden" id="reqHeaders">-</pre>
    </div>
    <div class="preview-row" id="reqBodyWrap">
      <div class="preview-label">请求体</div>
      <pre class="preview-value scrollbar-hidden" id="reqBody">-</pre>
    </div>
  </div>

  <div class="section">
    <div class="section-title">响应</div>
    <div class="response-status" id="responseStatus">-</div>
    <div class="preview-row" id="resHeadersWrap">
      <div class="preview-label">响应头</div>
      <pre class="preview-value scrollbar-hidden" id="resHeaders">-</pre>
    </div>
    <div class="preview-row" id="resBodyTextWrap">
      <div class="preview-label">响应体</div>
      <pre class="preview-value scrollbar-hidden" id="resBody">-</pre>
    </div>
    <div class="preview-row res-body-image" id="resBodyImageWrap">
      <div class="preview-label">响应体（图片）</div>
      <img id="resBodyImage" alt="响应图片" />
      <button type="button" class="btn-download-preview" id="resBodyImageDownloadBtn">下载图片</button>
    </div>
    <div class="preview-row res-body-binary" id="resBodyBinaryWrap">
      <div class="preview-label">响应体</div>
      <span class="res-binary-desc" id="resBodyBinaryDesc">二进制内容</span>
      <button type="button" class="btn-download-preview" id="resBodyBinaryDownloadBtn">下载文件</button>
    </div>
  </div>

  <script>
    (function() {
      const vscode = acquireVsCodeApi && acquireVsCodeApi();
      function escapeHtml(s) {
        if (s == null) return '';
        const div = document.createElement('div');
        div.textContent = String(s);
        return div.innerHTML;
      }
      function formatBody(body) {
        if (!body || !String(body).trim()) return '(无)';
        const trimmed = String(body).trim();
        if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
          try {
            return JSON.stringify(JSON.parse(body), null, 2);
          } catch (e) {
            return body;
          }
        }
        return body;
      }
      function formatHeaders(headers) {
        if (!headers || typeof headers !== 'object') return '(无)';
        const entries = Object.entries(headers);
        if (entries.length === 0) return '(无)';
        return entries.map(function(kv) { return kv[0] + ': ' + (kv[1] || ''); }).join('\n');
      }
      window.addEventListener('message', function(e) {
        const msg = e.data;
        if (msg.type !== 'init') return;
        const req = msg.request || {};
        const res = msg.response || {};
        document.getElementById('reqMethod').textContent = req.method || '-';
        document.getElementById('reqUrl').textContent = req.url || '-';
        document.getElementById('reqHeaders').textContent = formatHeaders(req.headers);
        var bodyText = req.body;
        if (req.formData && req.formData.length) {
          bodyText = req.formData.map(function(i) { return i.key + (i.type === 'file' ? '=[文件]' : '=' + (i.value || '')); }).join('\n');
        } else if (req.formUrlEncoded && req.formUrlEncoded.length) {
          bodyText = req.formUrlEncoded.map(function(i) { return i.key + '=' + (i.value || ''); }).join('&');
        }
        document.getElementById('reqBody').textContent = formatBody(bodyText);
        if (!bodyText || bodyText === '(无)') {
          var wrap = document.getElementById('reqBodyWrap');
          if (wrap) wrap.style.display = ['GET', 'HEAD'].indexOf(req.method) >= 0 ? 'none' : 'block';
        }
        var statusEl = document.getElementById('responseStatus');
        if (res.error) {
          statusEl.textContent = '错误: ' + res.error;
          statusEl.className = 'response-status error';
        } else {
          statusEl.textContent = (res.status != null ? res.status : '-') + ' ' + (res.statusText || '');
          statusEl.className = 'response-status ' + (res.status >= 200 && res.status < 300 ? 'success' : 'error');
        }
        document.getElementById('resHeaders').textContent = formatHeaders(res.headers);
        var bodyKind = res.bodyKind || 'text';
        var resBody = document.getElementById('resBody');
        var resBodyTextWrap = document.getElementById('resBodyTextWrap');
        var resBodyImageWrap = document.getElementById('resBodyImageWrap');
        var resBodyBinaryWrap = document.getElementById('resBodyBinaryWrap');
        var resBodyImage = document.getElementById('resBodyImage');
        var resBodyBinaryDesc = document.getElementById('resBodyBinaryDesc');
        resBodyTextWrap.style.display = 'block';
        resBodyImageWrap.classList.remove('show');
        resBodyBinaryWrap.classList.remove('show');
        if (bodyKind === 'image' && res.bodyBase64) {
          resBodyTextWrap.style.display = 'none';
          var ct = (res.headers && (res.headers['Content-Type'] || res.headers['content-type'])) || 'image/png';
          ct = String(ct).split(';')[0].trim();
          resBodyImage.src = 'data:' + ct + ';base64,' + res.bodyBase64;
          resBodyImageWrap.classList.add('show');
          resBodyImageWrap.dataset.bodyBase64 = res.bodyBase64;
          resBodyImageWrap.dataset.suggestedFilename = res.suggestedFilename || 'image.png';
        } else if (bodyKind === 'binary' && res.bodyBase64) {
          resBodyTextWrap.style.display = 'none';
          var len = Math.floor((res.bodyBase64.length * 3) / 4);
          resBodyBinaryDesc.textContent = '二进制内容 (' + len + ' 字节)';
          resBodyBinaryWrap.classList.add('show');
          resBodyBinaryWrap.dataset.bodyBase64 = res.bodyBase64;
          resBodyBinaryWrap.dataset.suggestedFilename = res.suggestedFilename || 'download.bin';
        } else {
          resBody.textContent = formatBody(res.body);
        }
        document.getElementById('resBodyImageDownloadBtn').onclick = function() {
          var w = document.getElementById('resBodyImageWrap');
          if (w && w.dataset.bodyBase64) vscode.postMessage({ type: 'downloadResponse', bodyBase64: w.dataset.bodyBase64, suggestedFilename: w.dataset.suggestedFilename || 'image.png' });
        };
        document.getElementById('resBodyBinaryDownloadBtn').onclick = function() {
          var w = document.getElementById('resBodyBinaryWrap');
          if (w && w.dataset.bodyBase64) vscode.postMessage({ type: 'downloadResponse', bodyBase64: w.dataset.bodyBase64, suggestedFilename: w.dataset.suggestedFilename || 'download.bin' });
        };
      });
    })();
  </script>
</body>
</html>
